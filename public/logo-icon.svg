<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="epicIconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0284c7" flood-opacity="0.25" />
    </filter>
    <linearGradient id="iconHexGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="35%" stop-color="#2563eb" />
      <stop offset="70%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="iconInnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f0fdf4" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="iconESpine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="iconBar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="iconBar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="iconBar3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="iconCheck" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#06b6d4" />
      <stop offset="80%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <g filter="url(#iconShadow)">
    <path d="M 256 36 C 268 36, 278 42, 285 46 L 435 133 C 448 141, 456 154, 456 169 L 456 343 C 456 358, 448 371, 435 379 L 285 466 C 278 470, 268 476, 256 476 C 244 476, 234 470, 227 466 L 77 379 C 64 371, 56 358, 56 343 L 56 169 C 56 154, 64 141, 77 133 L 227 46 C 234 42, 244 36, 256 36 Z" 
          fill="none" 
          stroke="url(#iconHexGrad)" 
          stroke-width="28" 
          stroke-linejoin="round" />
    <path d="M 256 56 L 438 161 L 438 351 L 256 456 L 74 351 L 74 161 Z" 
          fill="url(#iconInnerGrad)" 
          opacity="0.85" />
  </g>

  <g id="epicIconMonogram">
    <path d="M 134 195 L 214 149 L 214 186 L 174 209 L 174 316 L 224 287 L 224 324 L 134 376 Z" fill="url(#iconESpine)" />
    <path d="M 174 245 L 228 214 L 228 244 L 174 275 Z" fill="#0284c7" opacity="0.9" />

    <g id="iconPillar1">
      <path d="M 238 274 L 274 253 L 274 374 L 238 395 Z" fill="url(#iconBar1)" />
      <path d="M 238 274 L 274 253 L 292 263 L 256 284 Z" fill="#38bdf8" opacity="0.9" />
      <path d="M 274 253 L 292 263 L 292 384 L 274 374 Z" fill="#1e40af" opacity="0.6" />
    </g>

    <g id="iconPillar2">
      <path d="M 296 220 L 332 199 L 332 374 L 296 395 Z" fill="url(#iconBar2)" />
      <path d="M 296 220 L 332 199 L 350 209 L 314 230 Z" fill="#67e8f9" />
      <path d="M 332 199 L 350 209 L 350 384 L 332 374 Z" fill="#0e7490" opacity="0.6" />
    </g>

    <g id="iconPillar3">
      <path d="M 354 162 L 390 141 L 390 374 L 354 395 Z" fill="url(#iconBar3)" />
      <path d="M 354 162 L 390 141 L 408 151 L 372 172 Z" fill="#6ee7b7" />
      <path d="M 390 141 L 408 151 L 408 384 L 390 374 Z" fill="#047857" opacity="0.75" />
    </g>

    <path d="M 226 172 L 266 212 C 270 216, 276 216, 280 212 L 412 80 C 418 74, 428 78, 426 88 L 418 106 C 416 112, 412 116, 406 122 L 278 248 C 272 254, 262 254, 256 248 L 204 196 C 198 190, 202 180, 210 180 L 226 172 Z" 
          fill="url(#iconCheck)" 
          filter="url(#epicIconGlow)" />
  </g>
</svg>
