<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <filter id="fullShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.2" />
    </filter>
    <linearGradient id="fullHexGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="35%" stop-color="#2563eb" />
      <stop offset="70%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="fullInnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f0fdf4" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="fullTextEpic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="fullTextRubric" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Left Icon Emblem (scaled & centered around X=160, Y=160) -->
  <g transform="translate(20, 20) scale(0.55)" filter="url(#fullShadow)">
    <path d="M 256 36 C 268 36, 278 42, 285 46 L 435 133 C 448 141, 456 154, 456 169 L 456 343 C 456 358, 448 371, 435 379 L 285 466 C 278 470, 268 476, 256 476 C 244 476, 234 470, 227 466 L 77 379 C 64 371, 56 358, 56 343 L 56 169 C 56 154, 64 141, 77 133 L 227 46 C 234 42, 244 36, 256 36 Z" 
          fill="none" 
          stroke="url(#fullHexGrad)" 
          stroke-width="28" 
          stroke-linejoin="round" />
    <path d="M 256 56 L 438 161 L 438 351 L 256 456 L 74 351 L 74 161 Z" fill="url(#fullInnerGrad)" />

    <!-- Isometric E and Pillars -->
    <path d="M 134 195 L 214 149 L 214 186 L 174 209 L 174 316 L 224 287 L 224 324 L 134 376 Z" fill="#1e40af" />
    <path d="M 174 245 L 228 214 L 228 244 L 174 275 Z" fill="#0284c7" />

    <g>
      <path d="M 238 274 L 274 253 L 274 374 L 238 395 Z" fill="#2563eb" />
      <path d="M 238 274 L 274 253 L 292 263 L 256 284 Z" fill="#38bdf8" />
      <path d="M 274 253 L 292 263 L 292 384 L 274 374 Z" fill="#1e40af" />
    </g>

    <g>
      <path d="M 296 220 L 332 199 L 332 374 L 296 395 Z" fill="#0284c7" />
      <path d="M 296 220 L 332 199 L 350 209 L 314 230 Z" fill="#67e8f9" />
      <path d="M 332 199 L 350 209 L 350 384 L 332 374 Z" fill="#0e7490" />
    </g>

    <g>
      <path d="M 354 162 L 390 141 L 390 374 L 354 395 Z" fill="#059669" />
      <path d="M 354 162 L 390 141 L 408 151 L 372 172 Z" fill="#6ee7b7" />
      <path d="M 390 141 L 408 151 L 408 384 L 390 374 Z" fill="#047857" />
    </g>

    <path d="M 226 172 L 266 212 C 270 216, 276 216, 280 212 L 412 80 C 418 74, 428 78, 426 88 L 418 106 C 416 112, 412 116, 406 122 L 278 248 C 272 254, 262 254, 256 248 L 204 196 C 198 190, 202 180, 210 180 L 226 172 Z" 
          fill="#10b981" />
  </g>

  <!-- Typography Right Section -->
  <g transform="translate(320, 0)">
    <!-- Main Title -->
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="92" font-weight="900" letter-spacing="-1">
      <tspan fill="url(#fullTextEpic)">EPIC </tspan>
      <tspan fill="url(#fullTextRubric)" font-weight="800">e-Rubric</tspan>
    </text>

    <!-- Subtitle / Tagline Badge -->
    <g transform="translate(0, 195)">
      <rect x="0" y="0" width="460" height="38" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" />
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#047857" letter-spacing="1">
        PLATFORM ASESMEN VOKASI 4 DIMENSI
      </text>
    </g>

    <!-- 4 Dimensi Pills -->
    <g transform="translate(0, 256)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
      <text x="0" y="0" fill="#64748b">
        <tspan fill="#0284c7">• Evaluative</tspan>
        <tspan fill="#64748b">  </tspan>
        <tspan fill="#2563eb">• Predictive</tspan>
        <tspan fill="#64748b">  </tspan>
        <tspan fill="#7c3aed">• Integrative</tspan>
        <tspan fill="#64748b">  </tspan>
        <tspan fill="#059669">• Critical</tspan>
      </text>
    </g>
  </g>
</svg>
