<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Glow & Shadow Filter -->
    <filter id="epicGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.25" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="hexBorderGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="35%" stop-color="#2563eb" />
      <stop offset="70%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="hexInnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f0fdf4" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="eSpineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <linearGradient id="bar1Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="bar2Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>

    <linearGradient id="bar3Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="checkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#06b6d4" />
      <stop offset="80%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="facetTopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>

    <linearGradient id="facetRightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Hexagon Outer Border & Shadow -->
  <g filter="url(#cardShadow)">
    <!-- Outer Hexagon Frame -->
    <path d="M 256 36 
             C 268 36, 278 42, 285 46 
             L 435 133 
             C 448 141, 456 154, 456 169 
             L 456 343 
             C 456 358, 448 371, 435 379 
             L 285 466 
             C 278 470, 268 476, 256 476 
             C 244 476, 234 470, 227 466 
             L 77 379 
             C 64 371, 56 358, 56 343 
             L 56 169 
             C 56 154, 64 141, 77 133 
             L 227 46 
             C 234 42, 244 36, 256 36 Z" 
          fill="none" 
          stroke="url(#hexBorderGrad)" 
          stroke-width="28" 
          stroke-linejoin="round" />

    <!-- Inner Hexagon Background Shield -->
    <path d="M 256 56 
             L 438 161 
             L 438 351 
             L 256 456 
             L 74 351 
             L 74 161 Z" 
          fill="url(#hexInnerGrad)" 
          opacity="0.85" />
  </g>

  <!-- Isometric Monogram Core (Letter E + Ascending Assessment Pillars + Verified Checkmark) -->
  <g id="epicMonogram">
    <!-- E Backbone Structure (Left Iso Facet & Spine) -->
    <path d="M 134 195 
             L 214 149 
             L 214 186 
             L 174 209 
             L 174 316 
             L 224 287 
             L 224 324 
             L 134 376 Z" 
          fill="url(#eSpineGrad)" />

    <!-- E Middle Horizontal Prongs / Isometric Connector -->
    <path d="M 174 245 
             L 228 214 
             L 228 244 
             L 174 275 Z" 
          fill="#0284c7" 
          opacity="0.9" />

    <!-- Pillar 1 (Left Growth Bar - Stage 1 / Evaluative) -->
    <g id="pillar1">
      <path d="M 238 274 L 274 253 L 274 374 L 238 395 Z" fill="url(#bar1Grad)" />
      <!-- Top Cap -->
      <path d="M 238 274 L 274 253 L 292 263 L 256 284 Z" fill="url(#facetTopGrad)" opacity="0.9" />
      <!-- Right Depth Side -->
      <path d="M 274 253 L 292 263 L 292 384 L 274 374 Z" fill="#1e40af" opacity="0.6" />
    </g>

    <!-- Pillar 2 (Middle Growth Bar - Stage 2 / Predictive & Integrative) -->
    <g id="pillar2">
      <path d="M 296 220 L 332 199 L 332 374 L 296 395 Z" fill="url(#bar2Grad)" />
      <!-- Top Cap -->
      <path d="M 296 220 L 332 199 L 350 209 L 314 230 Z" fill="#67e8f9" />
      <!-- Right Depth Side -->
      <path d="M 332 199 L 350 209 L 350 384 L 332 374 Z" fill="#0e7490" opacity="0.6" />
    </g>

    <!-- Pillar 3 (Right Growth Bar - Stage 3 / Critical Mastery) -->
    <g id="pillar3">
      <path d="M 354 162 L 390 141 L 390 374 L 354 395 Z" fill="url(#bar3Grad)" />
      <!-- Top Cap -->
      <path d="M 354 162 L 390 141 L 408 151 L 372 172 Z" fill="#6ee7b7" />
      <!-- Right Depth Side -->
      <path d="M 390 141 L 408 151 L 408 384 L 390 374 Z" fill="url(#facetRightGrad)" opacity="0.75" />
    </g>

    <!-- Dynamic Checkmark Swoop (Verification & Standard Excellence) -->
    <path d="M 226 172 
             L 266 212 
             C 270 216, 276 216, 280 212 
             L 412 80 
             C 418 74, 428 78, 426 88 
             L 418 106 
             C 416 112, 412 116, 406 122 
             L 278 248 
             C 272 254, 262 254, 256 248 
             L 204 196 
             C 198 190, 202 180, 210 180 
             L 226 172 Z" 
          fill="url(#checkGrad)" 
          filter="url(#epicGlow)" />
  </g>

  <!-- Subtle Light Specular Sheen -->
  <path d="M 256 48 L 430 148 L 380 148 L 256 76 L 132 148 L 82 148 Z" 
        fill="#ffffff" 
        opacity="0.3" />
</svg>
